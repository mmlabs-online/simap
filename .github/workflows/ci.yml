name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:layers
      - run: pnpm test
      - name: migrate CLI
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        shell: bash
        run: |
          node db/migrate.js
          node db/migrate.js | tee /dev/stderr | grep -q "up to date"
      - name: migrate smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node scripts/migrate-smoke.mjs
      - run: pnpm format:check
      - run: pnpm build
      - run: test -f .next/standalone/server.js

  # SIM-004: builds the production image once and checks it (scripts/check-image.sh); the check also runs the
  # app and migrate inside the image against the postgres service. Then validates the deployment compose draft.
  # Never pushes, no registry login.
  image:
    needs: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: simap:ci-local
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: check-image
        run: bash scripts/check-image.sh simap:ci-local
        env:
          CHECK_IMAGE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: compose config
        shell: bash
        run: |
          # Dummy, non-secret values: only to let `docker compose config` resolve the file.
          printf 'SIMAP_IMAGE=mingming21400/simap:v0.0.0@sha256:%064d\n' 0 > "$RUNNER_TEMP/release.env"
          sudo install -d -m 755 /Users/mingming/.config/simap
          echo 'DATABASE_URL=postgres://ci:ci@postgres:5432/simap' | sudo tee /Users/mingming/.config/simap/simap.env >/dev/null
          compose=(docker compose -p simap -f deploy/deployment-repo/apps/simap/compose.yml)
          "${compose[@]}" --env-file "$RUNNER_TEMP/release.env" --profile migrate config --quiet
          if "${compose[@]}" --profile migrate config --quiet 2>/dev/null; then
            echo "::error::compose config must fail without --env-file"; exit 1
          fi
