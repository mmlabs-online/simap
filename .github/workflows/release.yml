# SIM-004 (D8, D57): a push to a branch `release/X.Y.Z` (commit must already be on main) releases exactly
# version vX.Y.Z (tag and image keep the `v`; it must be new and higher than every existing vX.Y.Z tag), creates and pushes that
# git tag, builds and pushes mingming21400/simap, then opens a pull
# request release/simap-vX.Y.Z on mmlabs-online/deployment that changes only apps/simap/release.env
# (image pinned by digest). Merging it runs deploy-simap on macbook-runner; this workflow deploys nothing itself.
# Copied from tudocuatui's release.yml (no version build arg). Runbook: README.md, "Release and deploy".
# The deploy runs backup + migrate before replacing the app.
#
# Secrets in this repo:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  push to mingming21400/simap
#   DEPLOY_REPO_TOKEN                    fine-grained PAT on mmlabs-online/deployment only:
#                                        Contents read/write, Pull requests read/write

name: release

on:
  push:
    branches: ["release/[0-9]*"]

permissions:
  contents: write # push the version tag

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: simap # folder apps/<APP>/ in the deployment repo
  NAMESPACE: mingming21400 # Docker Hub account

jobs:
  release:
    runs-on: ubuntu-latest # GitHub's runner: app code never runs on the home server
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: guards
        id: version
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: merge main into release, never commit to release directly"; exit 1
          fi
          if git tag --points-at "$GITHUB_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_SHA is already released ($(git tag --points-at "$GITHUB_SHA" | tr '\n' ' '))"; exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error::branch '$GITHUB_REF_NAME' is not release/X.Y.Z (for example release/0.2.0)"; exit 1
          fi
          TAG="v${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists: pick a new version branch"; exit 1
          fi
          last="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "::error::$TAG is not higher than the latest release $last"; exit 1
          fi
          echo "release version: $TAG (previous: ${last:-none})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          for name in DH_USER DH_TOKEN DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret for $name is empty (see README.md, Release and deploy)"; exit 1
            fi
          done

      # Reserve the version before pushing the image: a failed run never reuses it.
      - name: create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.NAMESPACE }}/simap:${{ steps.version.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # Check the exact bytes that will be pinned. If this fails, no PR is opened.
      - name: verify pushed digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          ref="$NAMESPACE/simap@$DIGEST"
          docker pull "$ref"
          bash scripts/check-image.sh "$ref"

      - name: pull request on the deployment repo
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          branch="release/$APP-$TAG"
          image_ref="$NAMESPACE/simap:$TAG@$DIGEST"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/mmlabs-online/deployment.git" deployment
          cd deployment
          git switch -c "$branch"
          mkdir -p "apps/$APP"
          {
            echo "# Written by the $APP release workflow for $TAG (commit $GITHUB_SHA). Do not edit by hand."
            echo "SIMAP_IMAGE=$image_ref"
            echo "SIMAP_VERSION=$TAG"
          } > "apps/$APP/release.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/release.env"
          if [ "$(git diff --cached --name-only)" != "apps/$APP/release.env" ]; then
            echo "::error::release commit must change only apps/$APP/release.env"; exit 1
          fi
          git commit -m "$APP $TAG"
          git push origin "$branch"
          gh pr create --repo mmlabs-online/deployment --base main --head "$branch" \
            --title "$APP $TAG" \
            --body "Deploys \`$image_ref\` (Next.js server; deploy runs backup + migrate, then replaces the app; $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA). Merging runs deploy-$APP on macbook-runner."
