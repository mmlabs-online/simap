# PR risk tiers for simap (spaceM CLAUDE.md §7). Written by /apply-kit; Ming reviews every change.
# Precedence: high > low > default. Globs use gitignore syntax.
# Keep `high:` in sync with "High paths" in .claude/loop.config.md (that list drives the plan-approval gate).
# Revisit when the scaffold ticket fixes the code layout.
version: 1
default: medium
high:
  # DB migrations
  - "migrations/**"
  - "db/migrations/**"
  - "**/*.sql"
  # Server auth, secrets and config
  - "server/**/auth*"
  - "src/server/**/auth*"
  - "**/config.*"
  - ".env.example"
  # Production build, release and deploy
  - "Dockerfile"
  - ".dockerignore"
  - "docker/**"
  - "deploy/**"
  - ".github/workflows/release*"
  - ".github/workflows/deploy*"
  # This file sets the merge rules for every later PR
  - ".github/risk-tiers.yml"
# Agent rules (CLAUDE.md, .claude/**) stay medium on purpose: never auto-merged without Ming's "cho merge".
low:
  - "docs/**"
  - "work/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "tests/**"
