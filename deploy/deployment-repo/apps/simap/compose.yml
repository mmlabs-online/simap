# simap on the home server, project `simap`. The image comes only from release.env, which the simap repo's
# release workflow writes in a release/simap-vX.Y.Z pull request as
#   SIMAP_IMAGE=mingming21400/simap:vX.Y.Z@sha256:<digest>
# Merging it runs .github/workflows/deploy-simap.yml. By hand:
#   docker compose -p simap -f apps/simap/compose.yml --env-file apps/simap/release.env run --rm migrate
#   docker compose -p simap -f apps/simap/compose.yml --env-file apps/simap/release.env up -d --wait simap
#
# NODE_ENV and MM_IDENTITY_ISSUER below are not secret. The server verifies mmlabs Identity bearer tokens; it
# fetches the keys (JWKS) from api.mmlabs.online, so the container needs egress through the `tunnel` (web)
# network. If that fails every guarded /api call is 401.
#
# One Next.js server on :3000 serves the UI and /api; no ports published: cloudflared reaches it as `simap`
# on the network (Cloudflare published application simap.mmlabs.online -> http://simap:3000).
#
# Database: the shared Postgres (postgres/), database and role `simap`. DATABASE_URL is in
# /Users/mingming/.config/simap/simap.env, written by deploy-simap from postgres/secrets/apps/simap.password on
# every run. It sits outside the checkout because the runner's checkout deletes untracked files. If it is
# missing, `config` fails and nothing starts. `migrate` shares the file but is only on the internal `db`
# network (no egress). No volumes here: all data lives in the shared `pgdata` volume.
#
# migrate: one-shot `node db/migrate.js` (profile `migrate`), run by the deploy before the app is replaced,
# never by `up -d` and never on a restore. The app container itself never migrates.

name: simap

x-app: &app
  image: ${SIMAP_IMAGE:?SIMAP_IMAGE is unset - pass --env-file apps/simap/release.env}
  env_file: /Users/mingming/.config/simap/simap.env

services:
  simap:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MM_IDENTITY_ISSUER: https://api.mmlabs.online
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # /api/readyz also checks the database connection. Node's fetch: no wget/curl needed in the image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [tunnel, db]

  migrate:
    <<: *app
    restart: "no"
    profiles: [migrate]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["node", "db/migrate.js"]
    networks: [db]

networks:
  tunnel:
    external: true
    # The network cloudflared is on: `web`, created by proxy/compose.yml.
    name: web
  db:
    external: true
    # The shared Postgres network, created by deploy-postgres (bootstrap).
    name: db
